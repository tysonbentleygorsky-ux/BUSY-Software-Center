name: Native JavaFX desktop build
on:
  push:
    paths:
      - "desktop-javafx/**"
      - ".github/workflows/native-desktop.yml"
  pull_request:
    paths:
      - "desktop-javafx/**"
      - ".github/workflows/native-desktop.yml"
  workflow_dispatch:

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and package
        working-directory: desktop-javafx
        run: mvn --batch-mode clean package
