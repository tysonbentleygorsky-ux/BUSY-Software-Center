spring:
  datasource:
    hikari:
      maximum-pool-size: 12
  sql:
    init:
      mode: never
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
