services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: busy_software_center
      POSTGRES_USER: busy_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - busy-postgres:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busy_app -d busy_software_center"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: ./services/api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/busy_software_center
      SPRING_DATASOURCE_USERNAME: busy_app
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8080:8080"]
  reports:
    build: ./services/reports
    environment:
      DATABASE_URL: postgresql+psycopg://busy_app:${POSTGRES_PASSWORD}@postgres:5432/busy_software_center
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8090:8090"]
volumes:
  busy-postgres:
